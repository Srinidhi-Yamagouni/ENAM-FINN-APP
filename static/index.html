<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" id="theme-color">
  <title>FINN — Investment Intelligence</title>
  <link rel="stylesheet" href="/static/style.css?v=22">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <strong>FINN</strong>
      <button class="provenance-pill" id="provBtn" aria-label="Data status and architecture">
        <span class="provenance-dot"></span>EOD Live Data
      </button>
    </div>
    <div class="header-actions">
      <button id="mode" aria-label="Toggle light mode">
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="gear" aria-label="Alert Settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1 -1 1.73l-.43.25a2 2 0 0 1 -2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1 -1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1 -1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1 -1 -1.74v-.5a2 2 0 0 1 1 -1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1 -2 0l-.43-.25a2 2 0 0 0-1 -1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="today" class="on" aria-label="Today Overview">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 3"/></svg></i>
      Today
    </button>
    <button data-tab="ask" aria-label="AI Copilot">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.8 5.8L20 11l-6.2 2.2L12 19l-1.8-5.8L4 11l6.2-2.2L12 3Z"/></svg></i>
      Copilot
    </button>
    <button data-tab="network" aria-label="Relationship Graph">
      <i><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="m10.5 7-4 9m7-9 4 9M7.5 19h9"/></svg></i>
      Network
    </button>
  </nav>
</div>
<div id="scrim" hidden></div>
<section id="sheet" hidden>
  <div class="grab"></div>
  <div id="sheetbody"></div>
</section>
<script src="/static/app.js?v=22"></script>
</body>
</html>
